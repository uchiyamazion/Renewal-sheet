<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>営業情報シート（リニューアル用）入力アプリ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --bg:#0f1a1f;
    --panel:#14232a;
    --panel2:#1b2e36;
    --line:#26424c;
    --ice:#7fd8e8;
    --ice-dim:#3f6d78;
    --steel:#9fb4bb;
    --text:#e8f2f4;
    --sub:#8fa5ac;
    --warn:#ff9d5c;
    --ok:#5cffb0;
    --radius:14px;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 80% -10%, #12262c 0%, transparent 60%),
      linear-gradient(180deg, #0b1418 0%, #0f1a1f 100%);
    color:var(--text);
    font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",-apple-system,BlinkMacSystemFont,sans-serif;
    display:flex;
    flex-direction:column;
    min-height:100%;
  }
  header{
    padding:18px 20px 14px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(20,35,42,.9), rgba(20,35,42,.4));
    backdrop-filter:blur(6px);
    position:sticky; top:0; z-index:10;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
  }
  .brand-mark{
    width:34px; height:34px; border-radius:9px;
    background:linear-gradient(145deg, var(--ice), #2c8ea3);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; color:#08171b; font-size:15px; letter-spacing:-1px;
    flex:none;
  }
  .brand-text h1{font-size:15px; margin:0; font-weight:700; letter-spacing:.02em;}
  .brand-text p{font-size:11px; margin:1px 0 0; color:var(--sub); letter-spacing:.04em;}
  .progress-wrap{margin-top:12px;}
  .progress-bar{height:4px; border-radius:3px; background:var(--panel2); overflow:hidden;}
  .progress-fill{height:100%; background:linear-gradient(90deg, var(--ice-dim), var(--ice)); width:0%; transition:width .35s ease;}
  .progress-label{font-size:10.5px; color:var(--sub); margin-top:6px; display:flex; justify-content:space-between; letter-spacing:.03em;}

  main{
    flex:1; overflow-y:auto; padding:18px 14px 140px;
    max-width:640px; width:100%; margin:0 auto;
  }
  .msg{display:flex; margin-bottom:16px; animation:rise .32s ease both;}
  @keyframes rise{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
  .msg.bot{justify-content:flex-start;}
  .msg.user{justify-content:flex-end;}
  .bubble{
    max-width:88%; padding:12px 15px; border-radius:var(--radius);
    font-size:14.5px; line-height:1.65; white-space:pre-wrap;
  }
  .msg.bot .bubble{
    background:var(--panel); border:1px solid var(--line);
    border-top-left-radius:4px;
    color:var(--text);
  }
  .msg.bot .bubble .field-name{color:var(--ice); font-weight:700;}
  .msg.user .bubble{
    background:linear-gradient(135deg, #1c4a55, #143036);
    border:1px solid var(--ice-dim);
    border-top-right-radius:4px;
    color:#eafcff;
  }
  .msg.user .bubble .kv{display:block; font-size:13px; color:var(--steel);}
  .msg.user .bubble .kv b{color:#eafcff; font-weight:600;}

  .section-tag{
    display:inline-block; font-size:10.5px; letter-spacing:.08em; color:var(--ice);
    background:rgba(127,216,232,.08); border:1px solid rgba(127,216,232,.25);
    padding:2px 8px; border-radius:20px; margin-bottom:8px;
  }

  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px; margin:8px 0 16px; max-width:88%;
  }
  .field{margin-bottom:12px;}
  .field:last-child{margin-bottom:0;}
  .field label{display:block; font-size:12px; color:var(--sub); margin-bottom:6px; letter-spacing:.02em;}
  .field input[type=text], .field input[type=number], .field input[type=date], .field textarea{
    width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:9px;
    padding:10px 11px; color:var(--text); font-size:15px; font-family:inherit;
    color-scheme: dark;
  }
  .field input:focus, .field textarea:focus{outline:none; border-color:var(--ice);}
  .field textarea{resize:vertical; min-height:64px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}

  .opts{display:flex; flex-wrap:wrap; gap:8px;}
  .opt-btn{
    padding:9px 14px; border-radius:20px; border:1px solid var(--line);
    background:var(--panel2); color:var(--text); font-size:14px; cursor:pointer;
    transition:.15s;
  }
  .opt-btn:hover{border-color:var(--ice-dim);}
  .opt-btn.selected{
    background:linear-gradient(135deg, var(--ice), #2c8ea3); color:#06171b;
    border-color:transparent; font-weight:700;
  }

  .toggle-line{
    display:flex; align-items:center; gap:9px; margin-bottom:10px; cursor:pointer;
    font-size:13.5px; color:var(--sub); user-select:none;
  }
  .toggle-box{
    width:18px; height:18px; border-radius:5px; border:1px solid var(--line);
    background:var(--panel2); flex:none; position:relative;
  }
  .toggle-line.on .toggle-box{background:var(--ice); border-color:var(--ice);}
  .toggle-line.on .toggle-box::after{
    content:''; position:absolute; left:5px; top:1px; width:5px; height:9px;
    border:solid #06171b; border-width:0 2px 2px 0; transform:rotate(45deg);
  }
  .toggle-line.on{color:var(--text);}
  .sub-fields{display:none;}
  .sub-fields.show{display:block; padding-top:2px;}

  .hint{font-size:11.5px; color:var(--sub); margin-top:8px; line-height:1.5;}

  footer{
    position:fixed; bottom:0; left:0; right:0;
    background:linear-gradient(0deg, rgba(11,20,24,.97), rgba(11,20,24,.9));
    border-top:1px solid var(--line);
    padding:12px 14px calc(14px + env(safe-area-inset-bottom));
    backdrop-filter:blur(8px);
  }
  .footer-inner{max-width:640px; margin:0 auto; display:flex; gap:8px;}
  .btn{
    flex:1; padding:13px 16px; border-radius:11px; border:none; font-size:15px; font-weight:700;
    cursor:pointer; letter-spacing:.02em; transition:.15s;
  }
  .btn-primary{background:linear-gradient(135deg, var(--ice), #2c8ea3); color:#06171b;}
  .btn-primary:disabled{opacity:.35; cursor:not-allowed;}
  .btn-ghost{
    flex:none; background:transparent; border:1px solid var(--line); color:var(--sub);
    padding:13px 16px;
  }
  .btn-ghost:hover{color:var(--text); border-color:var(--ice-dim);}

  .done-wrap{max-width:640px; margin:20px auto; padding:0 6px;}
  .done-card{
    background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:28px 22px;
    text-align:center;
  }
  .done-icon{
    width:56px; height:56px; border-radius:50%; margin:0 auto 14px;
    background:linear-gradient(135deg, var(--ok), #1f8f66);
    display:flex; align-items:center; justify-content:center; font-size:26px; color:#06171b;
  }
  .done-card h2{margin:0 0 6px; font-size:19px;}
  .done-card p{margin:0 0 20px; font-size:13.5px; color:var(--sub); line-height:1.6;}
  .dl-btn{
    display:inline-block; padding:14px 26px; border-radius:11px;
    background:linear-gradient(135deg, var(--ice), #2c8ea3); color:#06171b;
    text-decoration:none; font-weight:700; font-size:15px;
  }
  .restart{
    display:block; margin:16px auto 0; background:none; border:none; color:var(--sub);
    font-size:12.5px; text-decoration:underline; cursor:pointer;
  }

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">ST</div>
    <div class="brand-text">
      <h1>営業情報シート入力アシスタント</h1>
      <p>SION TECHNOS &middot; リニューアル用</p>
    </div>
  </div>
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label"><span id="progressText">0 / 0</span><span id="progressSection"></span></div>
  </div>
</header>

<main id="main"></main>

<footer id="footer">
  <div class="footer-inner">
    <button class="btn-ghost" id="skipBtn" type="button">スキップ</button>
    <button class="btn btn-primary" id="nextBtn" type="button" disabled>次へ</button>
  </div>
</footer>

/* ===================== XML編集ヘルパー ===================== */
function xmlEscape(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
// sheet1.xml中の指定セル(ref)をインライン文字列に置き換える。スタイル(s=)は保持する。
function setCell(xml, ref, text){
  const re = new RegExp('<c r="' + ref + '"([^>]*?)(/>|>[\\s\\S]*?</c>)');
  const m = xml.match(re);
  if(!m){ console.warn('cell not found:', ref); return xml; }
  let attrs = m[1] || '';
  attrs = attrs.replace(/\st="[^"]*"/,'');
  const esc = xmlEscape(text);
  const newCell = '<c r="' + ref + '"' + attrs + ' t="inlineStr"><is><t xml:space="preserve">' + esc + '</t></is></c>';
  return xml.slice(0, m.index) + newCell + xml.slice(m.index + m[0].length);
}

/* ===================== 質問ステップ定義 ===================== */
const STEPS = [];
function addStep(s){ STEPS.push(s); }

addStep({section:"基本情報", bot:"まず、シート作成日を教えてください。", fields:[
  {key:"date", label:"作成日", type:"date"}
], summary:a=>{
  if(!a.date) return "";
  const [y, m, d] = a.date.split('-');
  return `${y}年${parseInt(m,10)}月${parseInt(d,10)}日`;
},
  apply:(a,w)=>{
    if(!a.date) return;
    const [y, m, d] = a.date.split('-');
    w.sheet = setCell(w.sheet, "U1", `${y}年${parseInt(m,10)}月${parseInt(d,10)}日 作成`);
  }
});

addStep({section:"基本情報", bot:"既設機種と、新規で選定する機種の種別を選んでください。", fields:[
  {key:"old", label:"既設機種", type:"select", options:["吸収式","GHP","PAC","その他"]},
  {key:"nw", label:"新規選定機種", type:"select", options:["吸収式","GHP","PAC","その他"]},
], summary:a=>`既設:${a.old} / 新規:${a.nw}`,
  apply:(a,w)=>{
    const oldMap={"吸収式":"B6","GHP":"B7","PAC":"B8","その他":"B9"};
    const newMap={"吸収式":"N6","GHP":"N7","PAC":"N8","その他":"N9"};
    const oldLabel={"吸収式":"吸収式","GHP":"GHP","PAC":"PAC","その他":"その他"};
    w.sheet = setCell(w.sheet, oldMap[a.old], "◯"+oldLabel[a.old]);
    w.sheet = setCell(w.sheet, newMap[a.nw], "◯"+oldLabel[a.nw]);
  }});

  {key:"date", label:"工事希望日", type:"date", skippable:true},
  {key:"start", label:"開始（時）", type:"number", placeholder:"9", skippable:true},
  {key:"end", label:"終了（時）", type:"number", placeholder:"17", skippable:true},
], summary:a=>{
  let dStr = "-";
  let wStr = "-";
  if (a.date) {
    const dObj = new Date(a.date);
    dStr = `${dObj.getMonth() + 1}月${dObj.getDate()}日`;
    wStr = ["日","月","火","水","木","金","土"][dObj.getDay()];
  }
  return `${dStr}（${wStr}）${a.start||"-"}時〜${a.end||"-"}時`;
},
  apply:(a,w)=>{
    if(a.date) {
       const dObj = new Date(a.date);
       const m = dObj.getMonth() + 1;
       const d = dObj.getDate();
       const wd = ["日","月","火","水","木","金","土"][dObj.getDay()];
       w.sheet = setCell(w.sheet, "G62", `${m}月${d}日`);
       w.sheet = setCell(w.sheet, "P62", wd + "曜日");
    }
    if(a.start) w.sheet = setCell(w.sheet, "R62", a.start+"時");
    if(a.end) w.sheet = setCell(w.sheet, "Z62", a.end+"時まで");
  }
});

/* ===================== アプリロジック ===================== */
const main = document.getElementById('main');
const nextBtn = document.getElementById('nextBtn');
const skipBtn = document.getElementById('skipBtn');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');
const progressSection = document.getElementById('progressSection');

let stepIndex = 0;
const workbookState = { sheet: null };
let finished = false;
let currentFieldEls = {};
let currentOptionalOn = false;

function scrollBottom(){ main.scrollTop = main.scrollHeight; }

function botMsg(text, tag){
  const wrap = document.createElement('div');
  wrap.className = 'msg bot';
  const b = document.createElement('div');
  b.className = 'bubble';
  if(tag){
    const t = document.createElement('span');
    t.className = 'section-tag';
    t.textContent = tag;
    b.appendChild(t);
    b.appendChild(document.createElement('br'));
  }
  b.appendChild(document.createTextNode(text));
  wrap.appendChild(b);
  main.appendChild(wrap);
}

function userMsg(text){
  const wrap = document.createElement('div');
  wrap.className = 'msg user';
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  wrap.appendChild(b);
  main.appendChild(wrap);
}

function updateProgress(){
  const pct = Math.round((stepIndex / STEPS.length) * 100);
  progressFill.style.width = pct + '%';
  progressText.textContent = Math.min(stepIndex+1, STEPS.length) + ' / ' + STEPS.length;
  progressSection.textContent = STEPS[stepIndex] ? STEPS[stepIndex].section : '完了';
}

function validateEnabled(step){
  if(step.optionalGroup && !currentOptionalOn){ return true; }
  for(const f of step.fields){
    if(f.skippable) continue;
    const el = currentFieldEls[f.key];
    if(!el) continue;
    if(f.optionalIf){
      const otherEl = currentFieldEls[f.optionalIf.key];
      const otherVal = otherEl ? otherEl.getValue() : '';
      if(otherVal !== f.optionalIf.equals) continue; // not applicable right now, skip requirement
    }
    const v = el.getValue();
    if(v === '' || v === null || v === undefined) return false;
  }
  return true;
}

function refreshNextEnabled(step){
  nextBtn.disabled = !validateEnabled(step);
}

function makeTextField(f){
  const wrap = document.createElement('div');
  wrap.className = 'field';
  const label = document.createElement('label');
  label.textContent = f.label + (f.skippable ? '（任意）' : '');
  wrap.appendChild(label);
  const input = f.type === 'textarea' ? document.createElement('textarea') : document.createElement('input');
  
  if(f.type !== 'textarea') {
    input.type = f.type || 'text';
  }
  if(f.placeholder) input.placeholder = f.placeholder;

  // カレンダー(date)の場合は今日の日付を初期セット
  if (f.type === 'date') {
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    input.value = `${yyyy}-${mm}-${dd}`;
  }

  input.addEventListener('input', ()=>refreshNextEnabled(STEPS[stepIndex]));
  wrap.appendChild(input);
  return { el: wrap, getValue: ()=> input.value.trim(), focusEl: input };
}

function makeSelectField(f){
  const wrap = document.createElement('div');
  wrap.className = 'field';
  const label = document.createElement('label');
  label.textContent = f.label;
  wrap.appendChild(label);
  const opts = document.createElement('div');
  opts.className = 'opts';
  let selected = '';
  const buttons = [];
  f.options.forEach(opt=>{
    const btn = document.createElement('button');
    btn.type='button'; btn.className='opt-btn'; btn.textContent = opt;
    btn.addEventListener('click', ()=>{
      selected = opt;
      buttons.forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
      refreshNextEnabled(STEPS[stepIndex]);
      renderConditionalVisibility();
    });
    buttons.push(btn);
    opts.appendChild(btn);
  });
  wrap.appendChild(opts);
  return { el: wrap, getValue: ()=> selected };
}

function renderConditionalVisibility(){
  const step = STEPS[stepIndex];
  step.fields.forEach(f=>{
    if(f.optionalIf){
      const container = currentFieldEls[f.key].container;
      const otherVal = currentFieldEls[f.optionalIf.key].getValue();
      const show = otherVal === f.optionalIf.equals;
      container.style.display = show ? 'block' : 'none';
    }
  });
}

function renderStep(){
  if(stepIndex >= STEPS.length){ renderDone(); return; }
  const step = STEPS[stepIndex];
  updateProgress();
  botMsg(step.bot, step.section);

  const card = document.createElement('div');
  card.className = 'card';
  currentFieldEls = {};
  currentOptionalOn = false;

  const fieldsHost = document.createElement('div');
  fieldsHost.className = 'sub-fields' + (step.optionalGroup ? '' : ' show');

  if(step.optionalGroup){
    const toggle = document.createElement('div');
    toggle.className = 'toggle-line';
    const box = document.createElement('div'); box.className='toggle-box';
    const lbl = document.createElement('span'); lbl.textContent = step.toggleLabel || '入力する';
    toggle.appendChild(box); toggle.appendChild(lbl);
    toggle.addEventListener('click', ()=>{
      currentOptionalOn = !currentOptionalOn;
      toggle.classList.toggle('on', currentOptionalOn);
      fieldsHost.classList.toggle('show', currentOptionalOn);
      refreshNextEnabled(step);
    });
    card.appendChild(toggle);
  }

  step.fields.forEach(f=>{
    let made;
    if(f.type === 'select') made = makeSelectField(f);
    else made = makeTextField(f);
    made.container = made.el;
    currentFieldEls[f.key] = made;
    fieldsHost.appendChild(made.el);
  });
  card.appendChild(fieldsHost);
  main.appendChild(card);

  renderConditionalVisibility();
  skipBtn.style.display = (step.optionalGroup || step.fields.every(f=>f.skippable)) ? 'block' : 'none';
  refreshNextEnabled(step);
  scrollBottom();

  const firstInput = card.querySelector('input, textarea');
  if(firstInput && !step.optionalGroup) setTimeout(()=>firstInput.focus(), 200);
}

function collectAnswers(step){
  const a = {};
  step.fields.forEach(f=>{
    a[f.key] = currentFieldEls[f.key] ? currentFieldEls[f.key].getValue() : '';
    if(f.type === 'number' && a[f.key] !== '') a[f.key] = Number(a[f.key]);
  });
  return a;
}

nextBtn.addEventListener('click', ()=>{
  const step = STEPS[stepIndex];
  if(step.optionalGroup && !currentOptionalOn){
    userMsg('（スキップ）');
    stepIndex++;
    renderStep();
    return;
  }
  const a = collectAnswers(step);
  try{
    step.apply(a, workbookState);
  }catch(e){ console.error(e); }
  userMsg(step.summary ? step.summary(a) : Object.values(a).join(' / '));
  stepIndex++;
  renderStep();
});

skipBtn.addEventListener('click', ()=>{
  userMsg('（スキップ）');
  stepIndex++;
  renderStep();
});

function renderDone(){
  updateProgress();
  botMsg('お疲れさまでした！すべての項目の入力が完了しました。下のボタンからExcelファイルをダウンロードできます。', '完了');
  const doneWrap = document.createElement('div');
  doneWrap.className = 'done-wrap';
  doneWrap.innerHTML = `
    <div class="done-card">
      <div class="done-icon">&#10003;</div>
      <h2>入力完了</h2>
      <p>営業情報シート（リニューアル用）に入力内容を反映しました。<br>ダウンロードしてご確認ください。</p>
      <a href="#" class="dl-btn" id="downloadLink">Excelをダウンロード</a>
      <button class="restart" id="restartBtn">最初からやり直す</button>
    </div>
  `;
  main.appendChild(doneWrap);
  document.getElementById('footer').style.display = 'none';
  scrollBottom();

  document.getElementById('downloadLink').addEventListener('click', async (e)=>{
    e.preventDefault();
    await buildAndDownload();
  });
  document.getElementById('restartBtn').addEventListener('click', ()=>{
    location.reload();
  });
}

async function buildAndDownload(){
  const bytes = Uint8Array.from(atob(TEMPLATE_B64), c=>c.charCodeAt(0));
  const zip = await JSZip.loadAsync(bytes);
  const path = 'xl/worksheets/sheet1.xml';
  zip.file(path, workbookState.sheet);
  const out = await zip.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url = URL.createObjectURL(out);
  const a = document.createElement('a');
  const now = new Date();
  const stamp = now.getFullYear()+String(now.getMonth()+1).padStart(2,'0')+String(now.getDate()).padStart(2,'0');
  a.href = url;
  a.download = `営業情報シート_${stamp}.xlsx`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

async function init(){
  const bytes = Uint8Array.from(atob(TEMPLATE_B64), c=>c.charCodeAt(0));
  const zip = await JSZip.loadAsync(bytes);
  workbookState.sheet = await zip.file('xl/worksheets/sheet1.xml').async('string');
  renderStep();
}
init();
